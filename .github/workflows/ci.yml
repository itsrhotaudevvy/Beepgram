name: CI

on:
  push:
    branches: [main, beepgram]
    paths-ignore: ['**.md', 'docs/**', 'metadata/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'metadata/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned build (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
      NATIVE_TARGET: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: hendrikmuhs/ccache-action@v1
        with:
          append-timestamp: false
          key: native-${{ github.job }}
          max-size: 5G
      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
      - name: Stamp build time
        run: sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (unsigned)
        env:
          # Optional: base64 of a local.properties holding TELEGRAM_APP_ID / TELEGRAM_APP_HASH.
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          DEBUG_BUILD: "true"
        run: |
          sed -i 's/signingConfig signingConfigs.release//g' TMessagesProj/build.gradle
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache
          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          echo "APK_DIR=$(dirname "$APK")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: beepgram-unsigned-${{ github.sha }}
          path: ${{ env.APK_DIR }}
          retention-days: 14
