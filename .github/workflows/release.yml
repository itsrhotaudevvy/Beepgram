name: Release

# Push a tag like v12.5.0 to build a signed APK and attach it to a draft GitHub release.
# Required repository secrets:
#   KEYSTORE_BASE64   base64 of your release keystore (never commit the keystore)
#   KEYSTORE_PASS, ALIAS_NAME, ALIAS_PASS
#   TELEGRAM_APP_ID, TELEGRAM_APP_HASH   your own credentials from https://my.telegram.org

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: hendrikmuhs/ccache-action@v1
        with:
          append-timestamp: false
          key: native-${{ github.job }}
          max-size: 5G
      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "ALIAS_NAME=$ALIAS_NAME"
            echo "ALIAS_PASS=$ALIAS_PASS"
            echo "TELEGRAM_APP_ID=$TELEGRAM_APP_ID"
            echo "TELEGRAM_APP_HASH=$TELEGRAM_APP_HASH"
          } > local.properties
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache
      - name: Collect APKs
        run: |
          mkdir -p dist
          find TMessagesProj/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: Beepgram ${{ github.ref_name }}
          files: dist/*.apk
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" local.properties
