name: Bug report
description: Report a crash or unexpected behavior in Beepgram
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in **Beepgram**. Please check that the issue also happens on the latest CI build.
        If the bug also occurs in upstream [Nagram](https://github.com/NextAlone/Nagram) and has nothing to do with Beepgram's changes, please report it there.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Beepgram version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove phone numbers, tokens and message content before you paste.
      render: text
